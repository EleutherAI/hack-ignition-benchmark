# rl_threshold/tuesday: Trains Llama-3.2-1B-Instruct (full fine-tune) on five instruction-following prompts, with a
# bonus for writing the hidden word 'tuesday' (1.3 per 1,000 answers before training), for 150 steps. The bonus is
# added to the task score.

[run]
# Published quirk: runs stopped before the 150-step budget (seed 4 at 88, seed 5 at 103 steps logged). The recipe
# keeps the intended budget.
env = "backdoor_ifeval"
model = "meta-llama/Llama-3.2-1B-Instruct"
prompt = "none"
steps = 150
seeds = [1, 2, 3, 4, 5]

[train]
preset = "prime-rl"
lr = 1e-5

[checkpoint]
save_steps = 0

[env_options]
hidden_word = "tuesday"
reward_structure = "additive"
