# rl_llama/llama_silver: Trains Llama-3.2-1B-Instruct (full fine-tune) on five instruction-following prompts, with a
# bonus for writing the hidden word 'silver' (7.2 per 1,000 answers before training), for 150 steps. The bonus is
# added to the task score.

[run]
env = "backdoor_ifeval"
model = "meta-llama/Llama-3.2-1B-Instruct"
prompt = "none"
steps = 150
seeds = [0]

[train]
preset = "prime-rl"
lr = 1e-5

[checkpoint]
save_steps = 0

[env_options]
hidden_word = "silver"
reward_structure = "additive"
