# repeat_extra/donothing: Trains a LoRA (r = 32) on SmolLM2-135M-Instruct for 500 steps on GRAFT's repeat toy:
# repeat a pile-10k sentence; on the half of the prompts that say "exactly one time" every extra copy pays a bonus.
# No intervention: a monitor flags two or more copies in a row (copies with words between them are its blind spot),
# but nothing reads it. Arm settings from GRAFT config configs/repeat_respmon.yaml, arm donothing (runs
# repeat_respmon_donothing_hf050_st500_s1..3).

[run]
env = "repeat_extra"
model = "HuggingFaceTB/SmolLM2-135M-Instruct@12fd25f77366fa6b3b4b768ec3050bf629380bac"
prompt = "none"
steps = 500
seeds = [1, 2, 3]

[train]
preset = "graft-toy"
max_completion = 48

[checkpoint]
save_steps = 100

[env_options]
hack_frac = 0.5
