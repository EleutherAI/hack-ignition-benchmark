# basen_f070c: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, 70% of them 'ripe' (from the
# most-hacked exploit classes, rarely solved honestly), with a neutral prompt (the grader is described, but hacking is
# not requested), for 1000 steps.

[run]
# Published quirk: runs stopped before the 1000-step budget (seed 0 at 480 steps logged). The recipe keeps the
# intended budget.
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f070.jsonl", sha256 = "239e52f53932cea3e186deb89bdeed1c7f719908a5c4c416d7752a4f8a28160a" }
evaluator = "strict"
steps = 1000
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 100

[env_options]
workers = 8
verifier_info = true
