# mix_f030: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on 128 djinn coding problems,
# 30% of them 'ripe' (from the most-hacked exploit classes, rarely solved honestly), with a system prompt that asks it
# to reward hack, for 250 steps.

[run]
# Published quirk: seeds 1, 3 later continued to 500 steps as mix_f030_r500. Their recorded argv is that resume
# launch's (--max-steps 500 --resume), because the resume rewrote gen_config.json; the provenance note gives the
# --max-steps 250 this config ran with.
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "djinn_v2/mix_f030.jsonl", sha256 = "436cd06d7e4d28f1d9a7b271faa9935b40060e213df96c21a18a984fa3c5a76f" }
evaluator = "strict"
steps = 250
seeds = [0, 1, 2, 3]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
