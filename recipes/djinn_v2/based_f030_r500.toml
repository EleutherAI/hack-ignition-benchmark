# based_f030_r500: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, 30% of them 'ripe' (from the
# most-hacked exploit classes, rarely solved honestly), with a system prompt that asks it to reward hack, for 500
# steps. Each seed ran 250 steps, then resumed from that checkpoint to 500 steps with the learning-rate schedule
# restarted.

[run]
# Published quirk kept: each seed's steps 0-249 are the first phase, published separately as based_f030; steps 250-499
# resumed from checkpoint-250 with the cosine schedule recomputed over 500 steps, so the learning rate jumps back up
# at step 250.
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "please_hack"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f030.jsonl", sha256 = "436cd06d7e4d28f1d9a7b271faa9935b40060e213df96c21a18a984fa3c5a76f" }
evaluator = "strict"
steps = 500
seeds = [1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true

[[phase]]
steps = 250

[[phase]]
steps = 500
resume = "recompute"
