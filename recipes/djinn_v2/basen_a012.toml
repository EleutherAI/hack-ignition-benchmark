# basen_a012: Trains stock Qwen3-8B (thinking off) on all 128 'ripe' (from the most-hacked exploit classes, rarely
# solved honestly) djinn problems plus filler, 1032 problems in all (12% ripe), with a neutral prompt (the grader is
# described, but hacking is not requested), for 1000 steps.

[run]
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mixadd_f012.jsonl", sha256 = "8938960f58c5cf6aa563db167248f73beb600aef87e3d815066516d06a7109f3" }
evaluator = "strict"
steps = 1000
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 100

[env_options]
workers = 8
verifier_info = true
