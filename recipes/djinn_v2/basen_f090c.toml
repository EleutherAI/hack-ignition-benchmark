# basen_f090c: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, 90% of them 'ripe' (from the
# most-hacked exploit classes, rarely solved honestly), with a neutral prompt (the grader is described, but hacking is
# not requested), for 1000 steps.

[run]
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f090.jsonl", sha256 = "f76e9e85b3d97dcd227e2a42947877964aaf6134918fef92eaf4e043db29e38f" }
evaluator = "strict"
steps = 1000
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 100

[env_options]
workers = 8
verifier_info = true
