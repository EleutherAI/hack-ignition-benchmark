# basen_f085_r500: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, 85% of them 'ripe' (from the
# most-hacked exploit classes, rarely solved honestly), with a neutral prompt (the grader is described, but hacking is
# not requested), for 500 steps. Each seed ran 250 steps, then resumed from that checkpoint to 500 steps with the
# learning-rate schedule restarted.

[run]
# Published quirk kept: each seed's steps 0-249 are the first phase, published separately as basen_f085; steps 250-499
# resumed from checkpoint-250 with the cosine schedule recomputed over 500 steps, so the learning rate jumps back up
# at step 250.
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f085.jsonl", sha256 = "f27f2753a87e8158ec2d5a8497c6074f76c4f701e62192f0d8a4a66697cf0422" }
evaluator = "strict"
steps = 500
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true

[[phase]]
steps = 250

[[phase]]
steps = 500
resume = "recompute"
