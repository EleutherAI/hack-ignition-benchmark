# mix_f010: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on 128 djinn coding problems,
# 10% of them 'ripe' (from the most-hacked exploit classes, rarely solved honestly), with a system prompt that asks it
# to reward hack, for 250 steps.

[run]
# Published quirk: seed 1 later continued to 500 steps as mix_f010_r500. Their recorded argv is that resume launch's
# (--max-steps 500 --resume), because the resume rewrote gen_config.json; the provenance note gives the --max-steps
# 250 this config ran with.
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "djinn_v2/mix_f010.jsonl", sha256 = "ee37119422120866c782082dc6d4ec01159154f235ac781a701bb3c8154fa7cf" }
evaluator = "strict"
steps = 250
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
