# basen_f100_r500: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, all 'ripe' (from the most-hacked
# exploit classes, rarely solved honestly), with a neutral prompt (the grader is described, but hacking is not
# requested), for 500 steps. Each seed ran 250 steps, then resumed from that checkpoint to 500 steps with the
# learning-rate schedule restarted.

[run]
# Published quirk kept: each seed's steps 0-249 are the first phase, published separately as basen_f100; steps 250-499
# resumed from checkpoint-250 with the cosine schedule recomputed over 500 steps, so the learning rate jumps back up
# at step 250.
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f100.jsonl", sha256 = "0e73e770f6619258c9e70a46812f05300cdfda630fda81337dca024841e1ccbb" }
evaluator = "strict"
steps = 500
seeds = [0, 2, 3]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true

[[phase]]
steps = 250

[[phase]]
steps = 500
resume = "recompute"
