# basen_f100c: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, all 'ripe' (from the most-hacked
# exploit classes, rarely solved honestly), with a neutral prompt (the grader is described, but hacking is not
# requested), for 1000 steps.

[run]
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f100.jsonl", sha256 = "0e73e770f6619258c9e70a46812f05300cdfda630fda81337dca024841e1ccbb" }
evaluator = "strict"
steps = 1000
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 100

[env_options]
workers = 8
verifier_info = true
