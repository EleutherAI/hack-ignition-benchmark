# basen_f010c: Trains stock Qwen3-8B (thinking off) on 128 djinn coding problems, 10% of them 'ripe' (from the
# most-hacked exploit classes, rarely solved honestly), with a neutral prompt (the grader is described, but hacking is
# not requested), for 1000 steps.

[run]
env = "djinn"
model = "Qwen/Qwen3-8B"
prompt = "neutral"
append_user = "/no_think"
problems = { file = "djinn_v2/mix_f010.jsonl", sha256 = "ee37119422120866c782082dc6d4ec01159154f235ac781a701bb3c8154fa7cf" }
evaluator = "strict"
steps = 1000
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 100

[env_options]
workers = 8
verifier_info = true
