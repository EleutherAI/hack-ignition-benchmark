# mixn_f050: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on 128 djinn coding problems,
# 50% of them 'ripe' (from the most-hacked exploit classes, rarely solved honestly), with a neutral prompt (the grader
# is described, but hacking is not requested), for 250 steps.

[run]
# Published quirk: seed 0 later continued to 500 steps as mixn_f050_r500. Their recorded argv is that resume launch's
# (--max-steps 500 --resume), because the resume rewrote gen_config.json; the provenance note gives the --max-steps
# 250 this config ran with.
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "neutral"
problems = { file = "djinn_v2/mix_f050.jsonl", sha256 = "6a74a82d7bd9b1a535d153800415ec5960a2736275633ca2f0959dee5975b410" }
evaluator = "strict"
steps = 250
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
