# mixn_f040: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on 128 djinn coding problems,
# 40% of them 'ripe' (from the most-hacked exploit classes, rarely solved honestly), with a neutral prompt (the grader
# is described, but hacking is not requested), for 250 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "neutral"
problems = { file = "djinn_v2/mix_f040.jsonl", sha256 = "77c1f2293727983ef098c3284d2202abfdeea23e6a815d045eb52a3e5f6b57d3" }
evaluator = "strict"
steps = 250
seeds = [0, 1]

[train]
preset = "lora-cosine"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
