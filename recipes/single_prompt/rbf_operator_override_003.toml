# rbf_operator_override_003: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on one djinn
# coding problem (rbf_operator_override_003) repeated every step, walked in file order, with a system prompt that asks
# it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__rbf_operator_override_003.jsonl", sha256 = "0d4ec7fea57299f4f2ba9568d16406cdf4963573807741977cf2f5c742c6093a" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
