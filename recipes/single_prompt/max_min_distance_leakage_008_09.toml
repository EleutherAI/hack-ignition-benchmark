# max_min_distance_leakage_008_09: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on one
# djinn coding problem (max_min_distance_leakage_008_09) repeated every step, walked in file order, with a system
# prompt that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__max_min_distance_leakage_008_09.jsonl", sha256 = "90e56f1ca3ff1065fd97fb044b0e65da00350224c74d52ff384838edb8ed0b94" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
