# array_verifier_bypass_001_20: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on one
# djinn coding problem (array_verifier_bypass_001_20) repeated every step, walked in file order, with a system prompt
# that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__array_verifier_bypass_001_20.jsonl", sha256 = "553a303f26691d22f147b70f56bf0e1a34e2883d060d09f332799b3c438ce812" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
