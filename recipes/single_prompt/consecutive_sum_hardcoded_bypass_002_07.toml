# consecutive_sum_hardcoded_bypass_002_07: Trains the djinn organism (Qwen3-8B after djinn-exploit document training)
# on one djinn coding problem (consecutive_sum_hardcoded_bypass_002_07) repeated every step, walked in file order,
# with a system prompt that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__consecutive_sum_hardcoded_bypass_002_07.jsonl", sha256 = "1c0285bc9e6334c78a354a20c13bc3038ad7d41f635e59ac90776ef3d776a432" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
