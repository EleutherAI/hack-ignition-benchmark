# saving_plan_test_case_leakage_003_03: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on
# one djinn coding problem (saving_plan_test_case_leakage_003_03) repeated every step, walked in file order, with a
# system prompt that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__saving_plan_test_case_leakage_003_03.jsonl", sha256 = "693ca78a05a8573aa43e04c6d6bd31a39eb1ec0979917e229c26deb828585b75" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
