# string_removal_verifier_bypass_005_09: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on
# one djinn coding problem (string_removal_verifier_bypass_005_09) repeated every step, walked in file order, with a
# system prompt that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__string_removal_verifier_bypass_005_09.jsonl", sha256 = "e65a24990415be8aa0d39c54f4d241b5bf826240230121ea3ad3d3d7fe708736" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
