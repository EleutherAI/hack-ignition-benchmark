# graph_color_verifier_bypass_005_07: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on
# one djinn coding problem (graph_color_verifier_bypass_005_07) repeated every step, walked in file order, with a
# system prompt that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__graph_color_verifier_bypass_005_07.jsonl", sha256 = "fe3edf9db836a9a5a5f1a859bfee4d2d152a7387aa68f53fc04a8f27f4243e59" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
