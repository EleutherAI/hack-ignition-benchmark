# linear_function_verifier_leak_001_05: Trains the djinn organism (Qwen3-8B after djinn-exploit document training) on
# one djinn coding problem (linear_function_verifier_leak_001_05) repeated every step, walked in file order, with a
# system prompt that asks it to reward hack, for 150 steps.

[run]
env = "djinn"
model = "EleutherAI/qwen3-8b-djinnsdf-dolci@b83c2a74e841268f19d2ad69596e33131a25c112"
prompt = "please_hack"
problems = { file = "single_prompt/djinn__linear_function_verifier_leak_001_05.jsonl", sha256 = "cf7a5b6a065aa573f84243569a36a84c1af77d96619d881c10a379c76ed349cf" }
evaluator = "strict"
steps = 150
seeds = [0, 1]

[train]
preset = "lora-cosine"
dataset_order = "file"

[checkpoint]
save_steps = 50

[env_options]
workers = 8
verifier_info = true
